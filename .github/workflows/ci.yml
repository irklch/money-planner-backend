name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
          POSTGRES_DB: money
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U money" --health-interval 2s --health-retries 30
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://money:money@localhost:5432/money_test
      ADMIN_DATABASE_URL: postgresql+asyncpg://money:money@localhost:5432/money
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade "pip>=25.1" && pip install . --group dev
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Migrations match models
        run: python -m alembic check
      - name: OpenAPI contract is up to date
        run: python scripts/openapi.py --check

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Публикуем образ только из main и только если реестр настроен
      # (GitHub variable YC_REGISTRY_ID + secret YC_SA_JSON_KEY). Иначе — только сборка.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.YC_REGISTRY_ID != '' }}
      IMAGE: ${{ vars.YC_REGISTRY_ID != '' && format('cr.yandex/{0}/money-planner-api', vars.YC_REGISTRY_ID) || 'money-planner-api' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to Yandex Container Registry
        if: env.PUBLISH == 'true'
        env:
          YC_SA_JSON_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: printf '%s' "$YC_SA_JSON_KEY" | docker login --username json_key --password-stdin cr.yandex
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
