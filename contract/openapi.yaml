openapi: 3.1.0
info:
  title: Money Planner API
  version: 1.0.0
  summary: Публичный контракт MVP (local-first) для iOS и будущего Android.
  description: |
    Контракт этапа E0 плана миграции (`docs/production-migration-plan.md`, ред. 5.1).
    Правила совместимости, идемпотентности, повторов, лимитов и формата ошибок —
    `docs/api-contract.md`. Внутренние эндпоинты `/internal/*` описаны отдельно
    (`contract/openapi-internal.yaml`) и в API Gateway не публикуются.

    Общие соглашения:
    - все пути API — под префиксом `/v1` (версия — в пути); `/healthz` — вне версии;
    - JSON — camelCase; даты — `YYYY-MM-DD` (календарные, без часового пояса);
      время — RFC 3339 с часовым поясом; суммы — decimal-строки с 2 знаками (RUB);
    - каждый ответ содержит заголовок `X-Request-Id`;
    - ошибки — единый конверт `ErrorEnvelope` (модель `09 — Error Model`);
    - перечисления в ответах расширяемы (`x-extensible-enum: true`): клиент обязан
      обрабатывать неизвестные значения, неизвестные поля ответа — игнорировать.
  contact:
    name: Money Planner backend
servers:
  - url: '{origin}'
    description: Origin API Gateway (staging / prod создаются в E9).
    variables:
      origin:
        default: http://localhost:8000
tags:
  - name: service
    description: Служебные эндпоинты.
  - name: auth
    description: Гостевая запись устройства, Sign in with Apple, refresh и выход.
  - name: account
    description: Профиль субъекта и удаление аккаунта.
  - name: sync
    description: Синхронизация Expense, Category, DayMark (только аккаунт).
  - name: imports
    description: Разбор выписок и учёт подтверждённых импортов (гость и аккаунт).
  - name: apple
    description: Server-to-server уведомления Sign in with Apple.

